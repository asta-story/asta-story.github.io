.hdr{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,4vw,56px);pointer-events:none}

<script>
/* ============ 설정: 링크는 여기만 바꾸면 됩니다 ============ */
const CONFIG = {
  appLogo: "",
  links: {
    app: "https://play.google.com/store/apps/details?id=com.astagodsaeng.app",   // ASTA 앱 (Google Play)
    youtube: "https://www.youtube.com/@bulidup74",
    instagram: "https://www.instagram.com/asta_life7/",
    blog: "https://blog.naver.com/asta_life"                                       // 네이버 블로그
  },
  legal: {
    privacy: "",   // 아스타 앱 개인정보 처리방침 주소 (비어 있으면 숨김)
    terms: "",     // 아스타 앱 이용약관 주소 (비어 있으면 숨김)
    contact: "mailto:buildup74.official@gmail.com?subject=" + encodeURIComponent("[ASTA] 문의")
  }
};

/* ============ 4개의 별 (모두 같은 규격) ============ */
const STARS = [
  {k:"app",       n:"ASTA 앱",   d:"갓생 루틴 앱", cta:"앱 받기"},
  {k:"youtube",   n:"YouTube",   d:"영상 기록",    cta:"채널 보기"},
  {k:"blog",      n:"Blog",      d:"글과 기록",    cta:"블로그 보기"},
  {k:"instagram", n:"Instagram", d:"일상 기록",    cta:"인스타 보기"}
];
const starSVG = id => `<svg class="star" viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="g${id}" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fffaf0"/><stop offset=".45" stop-color="#f3d39a"/><stop offset="1" stop-color="#c99a4e"/></radialGradient></defs><circle cx="32" cy="32" r="13" fill="#f3d39a" opacity=".16"/><path d="M32 2 C33.6 22 42 30.4 62 32 C42 33.6 33.6 42 32 62 C30.4 42 22 33.6 2 32 C22 30.4 30.4 22 32 2 Z" fill="url(#g${id})"/><circle cx="32" cy="32" r="3.2" fill="#fff"/></svg>`;
const arrow = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const grid = document.getElementById("grid");
STARS.forEach((s,i)=>{
  const li=document.createElement("li"), a=document.createElement("a");
  a.className="card"; a.href=CONFIG.links[s.k]; a.target="_blank"; a.rel="noopener";
  a.setAttribute("aria-label", `${s.n} — ${s.d}, ${s.cta} (새 창)`);
  a.innerHTML = `${starSVG(i)}<h3>${s.n}</h3><p>${s.d}</p><span class="go">${s.cta}${arrow}</span>`;
  li.appendChild(a); grid.appendChild(li);
});
const legal=document.getElementById("legal");
[["privacy","개인정보 처리방침"],["terms","이용약관"],["contact","문의"]].forEach(([k,t])=>{
  const u=CONFIG.legal[k]; if(!u) return;
  const a=document.createElement("a"); a.href=u; a.textContent=t;
  if(!u.startsWith("mailto:")){a.target="_blank";a.rel="noopener";}
  legal.appendChild(a);
});
document.getElementById("yr").textContent=new Date().getFullYear();

/* ============ 장면 상태 ============ */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const S = {sun:1, storm:.1, cloud:.3, pitch:.07, pol:0, stars:0, zoom:1, dark:0, flash:0, shake:.25, rain:0, ship:-.35, shipA:0, clear:0, glow:0};

/* ============ WebGL 바다·하늘 ============ */
const cv=document.getElementById("sea");
const gl=cv.getContext("webgl",{antialias:false,alpha:false,powerPreference:"high-performance"});
const FS=`precision highp float;
uniform vec2 R;uniform float T,uSun,uStorm,uCloud,uPitch,uPol,uStars,uZoom,uDark,uFlash,uRoll,uClear,uGlow;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),u.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<5;i++){v+=a*nz(p);p=m*p;a*=.5;}return v;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec3 PD=normalize(vec3(0.,.62,1.));
vec3 SD;
vec3 sky(vec3 rd,float refl){
  float e=rd.y;
  vec3 nTop=vec3(.004,.009,.024),nHor=vec3(.018,.034,.07);
  vec3 col=mix(nHor,nTop,smoothstep(0.,.55,e));
  vec3 sHor=vec3(1.,.58,.26),sMid=vec3(.86,.3,.17),sTop=vec3(.13,.06,.15);
  vec3 ss=mix(sHor,sMid,smoothstep(0.,.13,e));ss=mix(ss,sTop,smoothstep(.1,.6,e));
  float sd=max(dot(rd,SD),0.);
  ss+=vec3(1.,.5,.2)*pow(sd,7.)*.55+vec3(1.,.82,.55)*pow(sd,350.)*(2.4+uGlow);
  col=mix(col,ss,uSun);
  col+=vec3(.05,.075,.13)*uPol*exp(-max(e,0.)*9.)*(1.-uSun);
  float ap=length(rd-PD);
  if(refl<.5){
    vec2 sp=vec2(atan(rd.x,rd.z),asin(clamp(e,-1.,1.)));
    float st=0.;
    for(int l=0;l<2;l++){
      float sc=l==0?70.:26.;float th=l==0?.962:.986;
      vec2 g=sp*sc,id=floor(g),f=fract(g)-.5;float h=h21(id+float(l)*17.);
      if(h>th){vec2 o=vec2(h21(id+3.1),h21(id+7.7))-.5;float d=length(f-o*.7);
        float r=(l==0?.11:.07)/uZoom;float b=(h-th)/(1.-th);
        st+=smoothstep(r,0.,d)*(.35+b)*(.75+.25*sin(T*(1.5+h*3.)+h*60.));}
    }
    col+=vec3(.82,.88,1.)*st*uStars*smoothstep(0.,.1,e)*1.4;
  }
  /* 북극성 */
  vec3 rt=normalize(cross(vec3(0,1,0),PD)),up=cross(PD,rt);
  vec2 q=vec2(dot(rd,rt),dot(rd,up));float dp=dot(rd,PD);
  float a2=dot(q,q);
  float tw=1.+.06*sin(T*2.3)+.04*sin(T*5.1);
  float core=exp(-a2/(.0000085))*3.2+exp(-a2/.00008)*.9;
  float halo=exp(-sqrt(a2)*28.)*.34+exp(-sqrt(a2)*7.)*.08;
  float sp1=exp(-abs(q.x)*1400.)*exp(-abs(q.y)*42.),sp2=exp(-abs(q.y)*1400.)*exp(-abs(q.x)*42.);
  vec2 qd=rot(.785)*q;float sp3=(exp(-abs(qd.x)*2200.)*exp(-abs(qd.y)*120.)+exp(-abs(qd.y)*2200.)*exp(-abs(qd.x)*120.))*.45;
  float pl=(core+halo+(sp1+sp2)*.9+sp3)*tw*step(0.,dp);
  vec3 pc=vec3(1.,.88,.66);
  /* 구름 */
  float cm=0.;vec3 cc=vec3(0);
  if(e>0.){
    vec2 cp=rd.xz/(e+.09)*.42+vec2(T*.012,T*.005);
    float c=fbm(cp*1.1+fbm(cp*.6)*.6);
    cm=smoothstep(.66-uCloud*.52,.98-uCloud*.52,c)*smoothstep(0.,.05,e);
    cm*=1.-uClear*smoothstep(.62,.08,ap);
    vec3 lit=mix(vec3(.016,.022,.04)*(.7+.6*c),vec3(.12,.06,.09)+vec3(1.,.45,.2)*pow(max(dot(rd,SD),0.),3.)*.95*(.4+c),uSun);
    lit+=vec3(.55,.62,.8)*uFlash*(.3+c*1.2);
    float edge=clamp(cm*(1.-cm)*4.,0.,1.);
    lit+=pc*uPol*.35*smoothstep(.7,.0,ap)*edge;
    cc=lit;
  }
  col+=pc*pl*uPol*(1.-cm*.92)*(refl>.5?.0:1.);
  col=mix(col,cc,cm*.96);
  col+=vec3(.4,.45,.6)*uFlash*.18;
  return col;
}
float waves(vec2 x){
  float h=0.,a=1.,f=.2,ch=mix(1.7,3.4,uStorm),spd=mix(.8,1.5,uStorm);
  vec2 d=vec2(.8,.6);mat2 r=mat2(.8,-.6,.6,.8);
  for(int i=0;i<5;i++){
    float w=nz(x*f*.45+float(i)*3.7)*1.7;
    float s=dot(d,x)*f+T*(.9+.33*float(i))*spd+w;
    h+=pow(1.-abs(sin(s)),ch)*a;
    d=r*d;f*=1.9;a*=.46;
  }
  return h;
}
void main(){
  SD=normalize(vec3(-.42,mix(-.14,.045,uSun),1.));
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
  uv=rot(uRoll)*uv;
  vec3 rd=normalize(vec3(uv*1.4/uZoom,1.));
  float cp=cos(uPitch),sp=sin(uPitch);
  rd=vec3(rd.x,rd.y*cp+rd.z*sp,-rd.y*sp+rd.z*cp);
  vec3 col;
  if(rd.y>=0.){col=sky(rd,0.);}
  else{
    vec3 ro=vec3(0.,mix(2.4,1.7,uStorm),T*1.2);
    float A=mix(.16,1.55,uStorm);
    float t=ro.y/(-rd.y);vec3 p=ro+rd*t;float h=waves(p.xz)*A;
    t=(ro.y-h*.85)/(-rd.y);p=ro+rd*t;h=waves(p.xz)*A;
    float e=.03+t*.004;
    float hx=waves(p.xz+vec2(e,0.))*A,hz=waves(p.xz+vec2(0.,e))*A;
    vec3 n=normalize(vec3(-(hx-h)/e,1.,-(hz-h)/e));
    vec2 mq=p.xz*1.7+vec2(T*.6,T*.4);n=normalize(n+vec3(nz(mq)-.5,0.,nz(mq+9.3)-.5)*.22*(1.-smoothstep(10.,90.,t)));
    n=normalize(mix(n,vec3(0,1,0),smoothstep(30.,260.,t)));
    float fr=.03+.97*pow(1.-max(dot(n,-rd),0.),4.);
    vec3 rf=reflect(rd,n);rf.y=abs(rf.y);
    vec3 body=mix(vec3(.003,.011,.022),vec3(.09,.035,.03),uSun);
    body+=vec3(0.,.05,.06)*clamp(h/A-.6,0.,1.)*(.25+uPol*.5+uSun);
    col=mix(body,sky(rf,1.),fr);
    col+=vec3(1.,.62,.3)*pow(max(dot(rf,SD),0.),90.)*2.4*uSun;
    col+=vec3(1.,.9,.72)*pow(max(dot(rf,PD),0.),520.)*3.2*uPol;
    col+=vec3(1.,.9,.72)*pow(max(dot(rf,PD),0.),60.)*.18*uPol;
    float foam=smoothstep(.9,1.35,h/A)*smoothstep(.25,1.,uStorm)*(1.-smoothstep(40.,160.,t));
    col=mix(col,vec3(.22,.27,.33)*(.25+.75*uSun+uPol*.35)+vec3(.5,.55,.7)*uFlash,foam*.75);
    vec3 hd=normalize(vec3(rd.x,.0005,rd.z));
    col=mix(col,sky(hd,1.),smoothstep(60.,520.,t));
  }
  float v=smoothstep(1.25,.2,length(uv*vec2(.82,1.15)));
  col*=1.-uDark*.55;
  col*=mix(1.,v,.3+uDark*.62);
  col=1.-exp(-col*1.55);
  col+=(h21(gl_FragCoord.xy+fract(T)*61.)-.5)*.018;
  gl_FragColor=vec4(col,1.);
}`;
let U={},ok=false,scale=1;
if(gl){
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(o));return null}return o};
  const vs=sh(gl.VERTEX_SHADER,"attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}"),fs=sh(gl.FRAGMENT_SHADER,FS);
  if(vs&&fs){
    const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
    if(gl.getProgramParameter(pr,gl.LINK_STATUS)){
      gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
      const l=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
      ["R","T","uSun","uStorm","uCloud","uPitch","uPol","uStars","uZoom","uDark","uFlash","uRoll","uClear","uGlow"].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
      ok=true;
    }
  }
}
if(!ok) document.documentElement.classList.add("nogl");

const fx=document.getElementById("fx"),cx=fx.getContext("2d");
const shipEl=document.getElementById("ship");
let W=0,H=0,mobile=false;
function size(){
  W=innerWidth;H=innerHeight;mobile=W<760;
  const base=Math.min(devicePixelRatio||1,1.5)*(mobile?.55:.72)*scale;
  cv.width=Math.round(W*base);cv.height=Math.round(H*base);
  if(ok) gl.viewport(0,0,cv.width,cv.height);
  const d=Math.min(devicePixelRatio||1,2);fx.width=W*d;fx.height=H*d;cx.setTransform(d,0,0,d,0,0);
  const sw=Math.min(mobile?W*.74:W*.36,560);shipEl.style.width=sw+"px";shipEl.style.height=(sw*0.585)+"px";
}
size();let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(size,150)});

/* 비·물보라 */
const rain=Array.from({length:mobile?110:220},()=>({x:Math.random(),y:Math.random(),l:.6+Math.random()*.8,s:.7+Math.random()*.6}));
const spray=[];
function drawFX(t,dt){
  cx.clearRect(0,0,W,H);
  if(S.rain>.01){
    cx.strokeStyle=`rgba(170,190,220,${.22*S.rain})`;cx.lineWidth=1;cx.beginPath();
    for(const r of rain){
      r.y+=dt*1.6*r.s;r.x-=dt*.35*r.s;if(r.y>1.05){r.y=-.05;r.x=Math.random()*1.2}if(r.x<-.05)r.x+=1.1;
      const x=r.x*W,y=r.y*H,L=34*r.l;cx.moveTo(x,y);cx.lineTo(x-L*.22,y+L);
    }cx.stroke();
  }
  if(S.shipA>.02&&!RM){
    const b=shipBox;if(b){
      for(let i=0;i<2;i++)spray.push({x:b.bx+Math.random()*6,y:b.by-Math.random()*4,vx:-30-Math.random()*60,vy:-40-Math.random()*70,a:1});
    }
  }
  for(let i=spray.length-1;i>=0;i--){const p=spray[i];p.vy+=160*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*1.2;
    if(p.a<=0){spray.splice(i,1);continue}
    cx.fillStyle=`rgba(225,232,245,${p.a*.5*S.shipA})`;cx.fillRect(p.x,p.y,1.6,1.6);}
  if(S.shipA>.02&&shipBox){
    const b=shipBox,g=cx.createLinearGradient(b.sx,0,b.bx,0);
    g.addColorStop(0,"rgba(210,220,235,0)");g.addColorStop(1,`rgba(210,220,235,${.28*S.shipA})`);
    cx.fillStyle=g;cx.beginPath();cx.ellipse((b.sx+b.bx)/2-b.w*.25,b.wy+1,b.w*.95,2.6,0,0,Math.PI*2);cx.fill();
    const m=cx.createLinearGradient(0,b.wy-b.w*.03,0,b.wy+b.w*.03);m.addColorStop(0,'rgba(3,7,16,0)');m.addColorStop(.5,`rgba(3,7,16,${.85*S.shipA})`);m.addColorStop(1,'rgba(3,7,16,0)');
    cx.fillStyle=m;cx.fillRect(b.sx+b.w*.02,b.wy-b.w*.03,b.w*.9,b.w*.06);
    cx.fillStyle=`rgba(243,211,154,${.35*S.shipA})`;cx.fillRect(b.sx+b.w*.12,b.wy-1,b.w*.72,1);
  }
}

let shipBox=null;
function placeShip(t){
  const hz=H*(.5+Math.tan(S.pitch+Math.sin(t*1.3)*.006*S.shake)*S.zoom/1.4);
  const w=parseFloat(shipEl.style.width),h=w*.585;
  const wy=hz+H*.034;
  const x=S.ship*W-w/2;
  const bob=RM?0:Math.sin(t*1.25)*1.3, by=RM?0:Math.sin(t*1.6)*3;
  shipEl.style.opacity=S.shipA;
  shipEl.style.transform=`translate3d(${x}px,${wy-h+by}px,0) rotate(${bob}deg)`;
  shipBox={sx:x,bx:x+w*.93,by:wy-h*.04+by,wy:wy+by,w};
}

let last=performance.now(),T0=last,frames=0,acc=0,tune=0;
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  const t=RM?4:(now-T0)/1000;
  if(ok&&!document.hidden){
    gl.uniform2f(U.R,cv.width,cv.height);gl.uniform1f(U.T,t);
    gl.uniform1f(U.uSun,S.sun);gl.uniform1f(U.uStorm,S.storm);gl.uniform1f(U.uCloud,S.cloud);
    gl.uniform1f(U.uPitch,S.pitch+(RM?0:Math.sin(t*1.3)*.006*S.shake));gl.uniform1f(U.uPol,S.pol);gl.uniform1f(U.uStars,S.stars);
    gl.uniform1f(U.uZoom,S.zoom);gl.uniform1f(U.uDark,S.dark);gl.uniform1f(U.uFlash,RM?0:S.flash);
    gl.uniform1f(U.uRoll,RM?0:Math.sin(t*.8)*.022*S.shake);gl.uniform1f(U.uClear,S.clear);gl.uniform1f(U.uGlow,S.glow);
    gl.drawArrays(gl.TRIANGLES,0,3);
    // 느린 기기 자동 화질 조절
    acc+=dt;frames++;if(acc>1.5&&tune<3){const fps=frames/acc;if(fps<40&&scale>.6){scale-=.15;size();tune++}acc=0;frames=0}
  }
  placeShip(t);drawFX(t,dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ============ 스크롤 연출 ============ */
gsap.registerPlugin(ScrollTrigger);
let lenis=null;
if(!RM){lenis=new Lenis({lerp:.085,smoothWheel:true});lenis.on("scroll",ScrollTrigger.update);gsap.ticker.add(t=>lenis.raf(t*1000));gsap.ticker.lagSmoothing(0);}

const $=id=>document.getElementById(id);
const tl=gsap.timeline({defaults:{ease:"none"},scrollTrigger:{trigger:"#story",start:"top top",end:"bottom bottom",scrub:RM?true:1.2}});
const tin=(el,at,d=.35)=>tl.fromTo(el,{opacity:0,y:30,filter:"blur(12px)"},{opacity:1,y:0,filter:"blur(0px)",duration:d,ease:"power2.out"},at);
const tout=(el,at,d=.3)=>tl.to(el,{opacity:0,y:-24,filter:"blur(10px)",duration:d,ease:"power2.in"},at);
// 1막 — 노을에서 어둠·거센 파도로
tl.to("#L0",{opacity:0,y:-40,filter:"blur(14px)",duration:.5},.15).to("#cue",{opacity:0,duration:.3},.1)
  .to(S,{sun:0,cloud:.86,dark:.5,glow:0,duration:1.9},.3)
  .to(S,{storm:1,dark:.86,pitch:.015,rain:1,shake:1,duration:1.2},2.2);
tin("#L1",.85);tout("#L1",1.85);
tin("#L2",2.45);tout("#L2",3.35);
tl.to(S,{flash:1,duration:.06},2.98).to(S,{flash:0,duration:.3},3.04);
// 2막 — 고개를 들면 보이는 북극성
tl.to(S,{pitch:.55,cloud:.32,clear:1,stars:1,pol:1,dark:.32,rain:0,shake:.35,duration:1.6,ease:"power1.inOut"},3.6);
tin("#L3",3.75);tout("#L3",4.45);
tin("#L4",4.75,.45);tout("#L4",5.55);
// 3막 — 확신에 찬 항해
tl.to(S,{pitch:.24,storm:.85,dark:.2,shake:.08,duration:1,ease:"power1.inOut"},5.8)
  .to(S,{shipA:1,duration:.35},6.0)
  .fromTo(S,{ship:-.18},{ship:1.2,duration:2,ease:"sine.inOut"},5.95);
tin("#L5",6.4);tout("#L5",7.4);
tl.to(S,{shipA:0,duration:.25},7.75);
// 4막 — 북극성 클로즈업
tl.to(S,{pitch:.465,zoom:3.3,dark:.12,cloud:.18,duration:1.4,ease:"power2.inOut"},7.8)
  .to({},{duration:1},9);

// 4개의 별 — 동시에 점등
gsap.fromTo("#temple .card",{opacity:0,y:24,filter:"brightness(1.8) blur(6px)"},{opacity:1,y:0,filter:"brightness(1) blur(0px)",duration:1.1,ease:"power3.out",
  scrollTrigger:{trigger:"#temple",start:"top 70%",toggleActions:"play none none reverse"}});
gsap.fromTo("#th",{opacity:0,letterSpacing:".3em"},{opacity:1,letterSpacing:".06em",duration:1.2,ease:"power3.out",
  scrollTrigger:{trigger:"#temple",start:"top 70%",toggleActions:"play none none reverse"}});

// 첫 화면 등장(1회)
if(!RM){
  gsap.from("#L0 h1 span",{y:60,opacity:0,filter:"blur(14px)",duration:1.4,ease:"power3.out",stagger:.09,delay:.2});
  gsap.from("#L0 .sub",{opacity:0,y:16,duration:1.1,ease:"power2.out",delay:.9});
  gsap.fromTo(S,{glow:2.5},{glow:0,duration:2.6,ease:"power2.out",delay:.1});
}

// 메뉴: 검은 화면 전환 후 즉시 이동
const veil=$("veil");
document.querySelectorAll("[data-jump]").forEach(a=>a.addEventListener("click",e=>{
  const id=a.getAttribute("href");const el=document.querySelector(id);if(!el)return;e.preventDefault();
  veil.classList.add("on");
  setTimeout(()=>{const y=id==="#story"?0:el.getBoundingClientRect().top+scrollY;
    lenis?lenis.scrollTo(y,{immediate:true,force:true}):scrollTo(0,y);
    ScrollTrigger.update();history.replaceState(null,"",id==="#story"?location.pathname:id);
    setTimeout(()=>veil.classList.remove("on"),120);},360);
}));
document.querySelector(".skip").addEventListener("click",e=>{e.preventDefault();document.querySelector('[href="#temple"][data-jump]').click();$("temple").querySelector("a.card")?.focus({preventScroll:true});});
if(location.hash==="#temple")addEventListener("load",()=>{const y=$("temple").getBoundingClientRect().top+scrollY;lenis?lenis.scrollTo(y,{immediate:true}):scrollTo(0,y)});
</script>
