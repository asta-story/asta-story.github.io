<style>
:root{
  --ink:#03060d; --navy:#071327; --amber:#ff9a4a; --ember:#e0603a;
  --gold:#f3d39a; --star:#fff6e4; --mute:rgba(236,232,224,.62);
  --serif:"Hahmlet",serif; --sans:"IBM Plex Sans KR",system-ui,sans-serif;
  --line:rgba(243,211,154,.22);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink);color:#ece8e0;-webkit-text-size-adjust:100%}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
body{font-family:var(--sans);overflow-x:hidden;background:var(--ink)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:4px}
.skip{position:fixed;left:16px;top:-60px;z-index:100;background:var(--gold);color:#120c04;padding:10px 16px;border-radius:999px;font-weight:500;transition:top .2s}
.skip:focus{top:14px}

/* ===== 배경 무대 ===== */
#sea{position:fixed;inset:0;width:100vw;height:100lvh;display:block;z-index:0;background:
  radial-gradient(120% 70% at 30% 62%,#ff9a4a 0%,#b8452f 28%,#2a1424 58%,#03060d 100%)}
#fx{position:fixed;inset:0;width:100vw;height:100lvh;z-index:2;pointer-events:none}
.fg{position:fixed;left:0;right:0;bottom:-2lvh;height:104lvh;z-index:1;pointer-events:none;will-change:transform,opacity}
.fg svg{display:block;width:100%;height:100%;overflow:visible}
#sailor,#hem,#head{transform-box:fill-box}
#hem{transform-origin:50% 0}
#head{transform-origin:50% 100%}
.nogl #sea{background:radial-gradient(60% 40% at 50% 30%,rgba(243,211,154,.25),transparent 60%),linear-gradient(#03060d,#071327 70%,#03060d)}

/* ===== 헤더 ===== */
.hdr{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:space-between;padding:22px clamp(20px,4vw,56px);pointer-events:none}
.hdr>*{pointer-events:auto}
.logo{font-family:var(--serif);font-weight:600;letter-spacing:.34em;font-size:15px;color:var(--star);padding:10px 0}
.hdr nav{display:flex;gap:clamp(16px,2.6vw,34px);font-size:14px}
.hdr nav a{position:relative;padding:12px 0;color:rgba(255,246,228,.82);transition:color .25s}
.hdr nav a::after{content:"";position:absolute;left:0;right:0;bottom:6px;height:1px;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.hdr nav a:hover{color:var(--star)}
.hdr nav a:hover::after{transform:scaleX(1);transform-origin:left}
.veil{position:fixed;inset:0;background:#000;z-index:80;opacity:0;pointer-events:none;transition:opacity .35s}
.veil.on{opacity:1}

/* ===== 스토리 텍스트 ===== */
#story{position:relative;height:1000lvh;z-index:3}
.stage{position:fixed;inset:0;z-index:4;pointer-events:none;display:grid;place-items:center}
.line{position:absolute;left:0;right:0;text-align:center;padding:0 24px;opacity:0;will-change:opacity,transform,filter}
.line h1,.line h2,.line p{font-family:var(--serif);font-weight:200;color:var(--star);letter-spacing:-.01em;text-shadow:0 0 40px rgba(0,0,0,.55)}
.hero{opacity:1;top:14vh}
.hero h1{font-weight:300;font-size:clamp(64px,13vw,188px);letter-spacing:.32em;margin-right:-.32em;line-height:1}
.hero h1 span{display:inline-block}
.hero .sub{margin-top:clamp(18px,2.4vw,30px);font-size:clamp(16px,1.6vw,21px);letter-spacing:.42em;margin-right:-.42em;color:rgba(255,240,220,.9);font-weight:300}
.cue{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);width:1px;height:56px;background:linear-gradient(rgba(255,246,228,0),rgba(255,246,228,.8));z-index:4;overflow:hidden}
.cue::after{content:"";position:absolute;left:0;top:-30%;width:1px;height:30%;background:#fff;animation:cue 2.6s cubic-bezier(.6,0,.3,1) infinite}
@keyframes cue{to{top:110%}}
.big{font-size:clamp(40px,7.4vw,108px)!important;line-height:1.1}
.mid{font-size:clamp(30px,5vw,72px)!important;line-height:1.15}
.gold{color:var(--gold)!important;text-shadow:0 0 30px rgba(243,211,154,.45),0 0 90px rgba(243,211,154,.25)!important;letter-spacing:.24em!important;margin-right:-.24em}
.l-low{top:auto;bottom:18vh}
.l-high{top:15vh}
.l-pol{top:60vh}
.l-mid{top:31vh}

/* ===== 4막: 네 개의 별 ===== */
#temple{position:relative;z-index:5;min-height:100lvh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 clamp(20px,4vw,56px) clamp(56px,9vh,110px)}
#temple h2{font-family:var(--serif);font-weight:200;font-size:clamp(26px,3vw,40px);color:var(--star);letter-spacing:.06em;margin-bottom:clamp(26px,4vh,46px);text-align:center;text-shadow:0 0 30px rgba(0,0,0,.6)}
.stars{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(14px,1.6vw,22px);width:100%;max-width:1120px}
.stars li{display:flex}
.card{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;height:clamp(270px,34vh,320px);padding:34px 22px 22px;border-radius:18px;
  background:linear-gradient(180deg,rgba(14,24,46,.62),rgba(5,9,20,.78));border:1px solid var(--line);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  box-shadow:0 30px 60px -30px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,236,200,.08);
  transition:transform .35s cubic-bezier(.2,.7,.2,1),border-color .35s,box-shadow .35s}
.card:hover{transform:translateY(-2px);border-color:rgba(243,211,154,.5);box-shadow:0 34px 70px -30px rgba(0,0,0,.9),0 0 40px -12px rgba(243,211,154,.35),inset 0 1px 0 rgba(255,236,200,.12)}
.star{width:58px;height:58px;flex:none;filter:drop-shadow(0 0 10px rgba(243,211,154,.55));transition:filter .35s,transform .5s cubic-bezier(.2,.7,.2,1)}
.card:hover .star{filter:drop-shadow(0 0 18px rgba(255,236,200,.95));transform:rotate(45deg) scale(1.05)}
.card h3{font-family:var(--serif);font-weight:500;font-size:22px;color:var(--star);margin-top:22px;letter-spacing:.02em;line-height:1.2}
.card p{font-size:14px;color:var(--mute);margin-top:8px;line-height:1.4}
.go{margin-top:auto;width:100%;height:46px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:1px solid rgba(243,211,154,.45);color:var(--gold);font-size:14px;font-weight:500;transition:background .3s,color .3s,border-color .3s}
.card:hover .go{background:var(--gold);color:#140e05;border-color:var(--gold)}
.go svg{width:14px;height:14px;transition:transform .3s}
.card:hover .go svg{transform:translateX(3px)}
.card:active{transform:translateY(0) scale(.99)}

/* ===== 푸터 ===== */
footer{position:relative;z-index:5;background:#010207;border-top:1px solid rgba(243,211,154,.12);padding:26px clamp(20px,4vw,56px) calc(26px + env(safe-area-inset-bottom))}
.ft{max-width:1120px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:13px;color:rgba(236,232,224,.55)}
.ft nav{display:flex;gap:6px 22px;flex-wrap:wrap}
.ft nav a{padding:10px 0;color:rgba(236,232,224,.78);transition:color .25s}
.ft nav a:hover{color:var(--gold)}
.ft .logo{font-size:12px;padding:0;color:rgba(255,246,228,.6)}

@media (max-width:900px){
  .stars{grid-template-columns:repeat(2,minmax(0,1fr))}
  .card{height:clamp(236px,30vh,270px);padding:26px 16px 16px}
  #temple{justify-content:center;padding-top:110px}
}
@media (max-width:420px){
  .card{height:226px;padding:22px 12px 12px;border-radius:16px}
  .star{width:46px;height:46px}
  .card h3{font-size:19px;margin-top:16px}
  .card p{font-size:13px}
  .go{height:44px;font-size:13px}
  .hdr nav{font-size:13px}
}
@media (prefers-reduced-motion:reduce){.cue::after{animation:none}}
</style>
</head>

/* ============ 장면 상태 ============ */
const RM = matchMedia("(prefers-reduced-motion: reduce)").matches;
const S = {sun:1, storm:.1, cloud:.3, pitch:.07, pol:0, stars:0, zoom:1, dark:0, flash:0, shake:.25, rain:0, fgA:1, look:0, clear:0, glow:0};

/* ============ WebGL 바다·하늘 ============ */
const cv=document.getElementById("sea");
const gl=cv.getContext("webgl",{antialias:false,alpha:false,powerPreference:"high-performance"});
const FS=`precision highp float;
uniform vec2 R;uniform float T,uSun,uStorm,uCloud,uPitch,uPol,uStars,uZoom,uDark,uFlash,uRoll,uClear,uGlow;
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);return mix(mix(h21(i),h21(i+vec2(1,0)),u.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;mat2 m=mat2(1.6,1.2,-1.2,1.6);for(int i=0;i<5;i++){v+=a*nz(p);p=m*p;a*=.5;}return v;}
mat2 rot(float a){float c=cos(a),s=sin(a);return mat2(c,-s,s,c);}
vec3 PD=normalize(vec3(0.,.62,1.));
vec3 SD;
vec3 sky(vec3 rd,float refl){
  float e=rd.y;
  vec3 nTop=vec3(.004,.009,.024),nHor=vec3(.018,.034,.07);
  vec3 col=mix(nHor,nTop,smoothstep(0.,.55,e));
  vec3 sHor=vec3(1.,.58,.26),sMid=vec3(.86,.3,.17),sTop=vec3(.13,.06,.15);
  vec3 ss=mix(sHor,sMid,smoothstep(0.,.13,e));ss=mix(ss,sTop,smoothstep(.1,.6,e));
  float sd=max(dot(rd,SD),0.);
  ss+=vec3(1.,.5,.2)*pow(sd,7.)*.55+vec3(1.,.82,.55)*pow(sd,350.)*(2.4+uGlow);
  col=mix(col,ss,uSun);
  col+=vec3(.05,.075,.13)*uPol*exp(-max(e,0.)*9.)*(1.-uSun);
  float ap=length(rd-PD);
  if(refl<.5){
    vec2 sp=vec2(atan(rd.x,rd.z),asin(clamp(e,-1.,1.)));
    float st=0.;
    for(int l=0;l<2;l++){
      float sc=l==0?70.:26.;float th=l==0?.962:.986;
      vec2 g=sp*sc,id=floor(g),f=fract(g)-.5;float h=h21(id+float(l)*17.);
      if(h>th){vec2 o=vec2(h21(id+3.1),h21(id+7.7))-.5;float d=length(f-o*.7);
        float r=(l==0?.11:.07)/uZoom;float b=(h-th)/(1.-th);
        st+=smoothstep(r,0.,d)*(.35+b)*(.75+.25*sin(T*(1.5+h*3.)+h*60.));}
    }
    col+=vec3(.82,.88,1.)*st*uStars*smoothstep(0.,.1,e)*1.4;
  }
  /* 북극성 */
  vec3 rt=normalize(cross(vec3(0,1,0),PD)),up=cross(PD,rt);
  vec2 q=vec2(dot(rd,rt),dot(rd,up));float dp=dot(rd,PD);
  float a2=dot(q,q);
  float tw=1.+.06*sin(T*2.3)+.04*sin(T*5.1);
  float core=exp(-a2/(.0000085))*3.2+exp(-a2/.00008)*.9;
  float halo=exp(-sqrt(a2)*28.)*.34+exp(-sqrt(a2)*7.)*.08;
  float sp1=exp(-abs(q.x)*1400.)*exp(-abs(q.y)*42.),sp2=exp(-abs(q.y)*1400.)*exp(-abs(q.x)*42.);
  vec2 qd=rot(.785)*q;float sp3=(exp(-abs(qd.x)*2200.)*exp(-abs(qd.y)*120.)+exp(-abs(qd.y)*2200.)*exp(-abs(qd.x)*120.))*.45;
  float pl=(core+halo+(sp1+sp2)*.9+sp3)*tw*step(0.,dp);
  vec3 pc=vec3(1.,.88,.66);
  /* 구름 */
  float cm=0.;vec3 cc=vec3(0);
  if(e>0.){
    vec2 cp=rd.xz/(e+.09)*.42+vec2(T*.012,T*.005);
    float c=fbm(cp*1.1+fbm(cp*.6)*.6);
    cm=smoothstep(.66-uCloud*.52,.98-uCloud*.52,c)*smoothstep(0.,.05,e);
    cm*=1.-uClear*smoothstep(.62,.08,ap);
    vec3 lit=mix(vec3(.016,.022,.04)*(.7+.6*c),vec3(.12,.06,.09)+vec3(1.,.45,.2)*pow(max(dot(rd,SD),0.),3.)*.95*(.4+c),uSun);
    lit+=vec3(.55,.62,.8)*uFlash*(.3+c*1.2);
    float edge=clamp(cm*(1.-cm)*4.,0.,1.);
    lit+=pc*uPol*.35*smoothstep(.7,.0,ap)*edge;
    cc=lit;
  }
  col+=pc*pl*uPol*(1.-cm*.92)*(refl>.5?.0:1.);
  col=mix(col,cc,cm*.96);
  col+=vec3(.4,.45,.6)*uFlash*.18;
  return col;
}
float waves(vec2 x){
  float h=0.,a=1.,f=.2,ch=mix(1.7,3.4,uStorm),spd=mix(.8,1.5,uStorm);
  vec2 d=vec2(.8,.6);mat2 r=mat2(.8,-.6,.6,.8);
  for(int i=0;i<5;i++){
    float w=nz(x*f*.45+float(i)*3.7)*1.7;
    float s=dot(d,x)*f+T*(.9+.33*float(i))*spd+w;
    h+=pow(1.-abs(sin(s)),ch)*a;
    d=r*d;f*=1.9;a*=.46;
  }
  return h;
}
void main(){
  SD=normalize(vec3(-.42,mix(-.14,.045,uSun),1.));
  vec2 uv=(gl_FragCoord.xy-.5*R)/R.y;
  uv=rot(uRoll)*uv;
  vec3 rd=normalize(vec3(uv*1.4/uZoom,1.));
  float cp=cos(uPitch),sp=sin(uPitch);
  rd=vec3(rd.x,rd.y*cp+rd.z*sp,-rd.y*sp+rd.z*cp);
  vec3 col;
  if(rd.y>=0.){col=sky(rd,0.);}
  else{
    vec3 ro=vec3(0.,mix(2.4,1.7,uStorm),T*1.2);
    float A=mix(.16,1.55,uStorm);
    float t=ro.y/(-rd.y);vec3 p=ro+rd*t;float h=waves(p.xz)*A;
    t=(ro.y-h*.85)/(-rd.y);p=ro+rd*t;h=waves(p.xz)*A;
    float e=.03+t*.004;
    float hx=waves(p.xz+vec2(e,0.))*A,hz=waves(p.xz+vec2(0.,e))*A;
    vec3 n=normalize(vec3(-(hx-h)/e,1.,-(hz-h)/e));
    vec2 mq=p.xz*1.7+vec2(T*.6,T*.4);n=normalize(n+vec3(nz(mq)-.5,0.,nz(mq+9.3)-.5)*.22*(1.-smoothstep(10.,90.,t)));
    n=normalize(mix(n,vec3(0,1,0),smoothstep(30.,260.,t)));
    float fr=.03+.97*pow(1.-max(dot(n,-rd),0.),4.);
    vec3 rf=reflect(rd,n);rf.y=abs(rf.y);
    vec3 body=mix(vec3(.003,.011,.022),vec3(.09,.035,.03),uSun);
    body+=vec3(0.,.05,.06)*clamp(h/A-.6,0.,1.)*(.25+uPol*.5+uSun);
    col=mix(body,sky(rf,1.),fr);
    col+=vec3(1.,.62,.3)*pow(max(dot(rf,SD),0.),90.)*2.4*uSun;
    col+=vec3(1.,.9,.72)*pow(max(dot(rf,PD),0.),520.)*3.2*uPol;
    col+=vec3(1.,.9,.72)*pow(max(dot(rf,PD),0.),60.)*.18*uPol;
    float foam=smoothstep(.9,1.35,h/A)*smoothstep(.25,1.,uStorm)*(1.-smoothstep(40.,160.,t));
    col=mix(col,vec3(.22,.27,.33)*(.25+.75*uSun+uPol*.35)+vec3(.5,.55,.7)*uFlash,foam*.75);
    vec3 hd=normalize(vec3(rd.x,.0005,rd.z));
    col=mix(col,sky(hd,1.),smoothstep(60.,520.,t));
  }
  float v=smoothstep(1.25,.2,length(uv*vec2(.82,1.15)));
  col*=1.-uDark*.55;
  col*=mix(1.,v,.3+uDark*.62);
  col=1.-exp(-col*1.55);
  col+=(h21(gl_FragCoord.xy+fract(T)*61.)-.5)*.018;
  gl_FragColor=vec4(col,1.);
}`;
let U={},ok=false,scale=1;
if(gl){
  const sh=(t,s)=>{const o=gl.createShader(t);gl.shaderSource(o,s);gl.compileShader(o);if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(o));return null}return o};
  const vs=sh(gl.VERTEX_SHADER,"attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}"),fs=sh(gl.FRAGMENT_SHADER,FS);
  if(vs&&fs){
    const pr=gl.createProgram();gl.attachShader(pr,vs);gl.attachShader(pr,fs);gl.linkProgram(pr);
    if(gl.getProgramParameter(pr,gl.LINK_STATUS)){
      gl.useProgram(pr);const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
      gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
      const l=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(l);gl.vertexAttribPointer(l,2,gl.FLOAT,false,0,0);
      ["R","T","uSun","uStorm","uCloud","uPitch","uPol","uStars","uZoom","uDark","uFlash","uRoll","uClear","uGlow"].forEach(n=>U[n]=gl.getUniformLocation(pr,n));
      ok=true;
    }
  }
}
if(!ok) document.documentElement.classList.add("nogl");

const fx=document.getElementById("fx"),cx=fx.getContext("2d");
let W=0,H=0,mobile=false;
function size(){
  W=innerWidth;H=innerHeight;mobile=W<760;
  const base=Math.min(devicePixelRatio||1,1.5)*(mobile?.55:.72)*scale;
  cv.width=Math.round(W*base);cv.height=Math.round(H*base);
  if(ok) gl.viewport(0,0,cv.width,cv.height);
  const d=Math.min(devicePixelRatio||1,2);fx.width=W*d;fx.height=H*d;cx.setTransform(d,0,0,d,0,0);
  
}

/* 비·물보라 */
const rain=Array.from({length:mobile?110:220},()=>({x:Math.random(),y:Math.random(),l:.6+Math.random()*.8,s:.7+Math.random()*.6}));
const spray=[];
function drawFX(t,dt){
  cx.clearRect(0,0,W,H);
  if(S.rain>.01){
    cx.strokeStyle=`rgba(170,190,220,${.22*S.rain})`;cx.lineWidth=1;cx.beginPath();
    for(const r of rain){
      r.y+=dt*1.6*r.s;r.x-=dt*.35*r.s;if(r.y>1.05){r.y=-.05;r.x=Math.random()*1.2}if(r.x<-.05)r.x+=1.1;
      const x=r.x*W,y=r.y*H,L=34*r.l;cx.moveTo(x,y);cx.lineTo(x-L*.22,y+L);
    }cx.stroke();
  }
  if(bow&&S.fgA>.05&&!RM&&S.storm>.3&&bow.y<H){
    // 파도에 부딪힐 때마다 뱃머리 위로 물보라
    const burst=Math.max(0,Math.sin(t*1.5-1.2))**6*S.storm;
    const n=Math.round(burst*(mobile?6:12));
    for(let i=0;i<n;i++)spray.push({x:bow.x+(Math.random()-.5)*60*bow.s,y:bow.y,vx:(Math.random()-.5)*260,vy:-(160+Math.random()*320)*(.6+S.storm*.6),a:1,r:1+Math.random()*2.2});
  }
  for(let i=spray.length-1;i>=0;i--){const p=spray[i];p.vy+=160*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a-=dt*1.2;
    if(p.a<=0){spray.splice(i,1);continue}
    cx.fillStyle=`rgba(215,225,240,${p.a*.45*S.fgA})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();}
}

const fgEl=document.getElementById("fg"),fgSvg=document.getElementById("fgsvg"),hem=document.getElementById("hem"),head=document.getElementById("head"),
  lglow=document.getElementById("lglow"),lcore=document.getElementById("lcore"),sailor=document.getElementById("sailor");
let bow=null,rimKey="";
function placeFG(t){
  // 카메라가 배에 붙어 있음: 시선이 올라가면 갑판은 화면 아래로 내려감
  const p0=.07, shift=H*(Math.tan(S.pitch)-Math.tan(p0))*S.zoom/1.4;
  const heave=RM?0:Math.sin(t*1.5)*H*.006*S.shake;
  fgSvg.setAttribute("viewBox", mobile?"640 0 620 1000":"0 0 1600 1000");
  fgEl.style.opacity=S.fgA;
  fgEl.style.transform=`translate3d(0,${shift+heave}px,0)`;
  hem.style.transform=RM?"":`skewX(${Math.sin(t*2.3)*(1.2+3.5*S.storm*S.shake)}deg)`;
  head.style.transform=`translateY(${S.look*5}px) scaleY(${1-S.look*.07})`;
  const lamp=.35+.65*(1-S.sun);lglow.style.opacity=lamp*(.8+(RM?0:Math.sin(t*7)*.05+Math.sin(t*13)*.04));lcore.style.opacity=.5+.5*lamp;
  // 테두리 빛: 노을엔 왼쪽 주황, 북극성 아래선 위쪽 금빛
  const k=(S.sun>.5?"s":"n")+Math.round(S.pol*4);
  if(k!==rimKey){rimKey=k;
    const amber=`drop-shadow(-1.6px -.6px 0 rgba(255,150,80,${(.65*S.sun).toFixed(2)}))`,gold=`drop-shadow(0 -1.6px 0 rgba(255,226,175,${(.25+.45*S.pol).toFixed(2)}))`;
    sailor.style.filter=`${S.sun>.5?amber:gold} drop-shadow(0 0 12px rgba(243,211,154,${(.12*S.pol).toFixed(2)}))`;}
  // 뱃머리 끝 화면 좌표 (물보라 시작점)
  const r=fgSvg.getBoundingClientRect(),vb=mobile?[640,620]:[0,1600],sc=Math.max(r.width/vb[1],r.height/1000);
  const ox=r.left+(r.width-vb[1]*sc)/2-vb[0]*sc, oy=r.top+r.height-1000*sc;
  bow={x:ox+800*sc,y:oy+780*sc,s:sc};
}
let last=performance.now(),T0=last,frames=0,acc=0,tune=0;
function loop(now){
  const dt=Math.min((now-last)/1000,.05);last=now;
  const t=RM?4:(now-T0)/1000;
  if(ok&&!document.hidden){
    gl.uniform2f(U.R,cv.width,cv.height);gl.uniform1f(U.T,t);
    gl.uniform1f(U.uSun,S.sun);gl.uniform1f(U.uStorm,S.storm);gl.uniform1f(U.uCloud,S.cloud);
    gl.uniform1f(U.uPitch,S.pitch+(RM?0:Math.sin(t*1.3)*.006*S.shake));gl.uniform1f(U.uPol,S.pol);gl.uniform1f(U.uStars,S.stars);
    gl.uniform1f(U.uZoom,S.zoom);gl.uniform1f(U.uDark,S.dark);gl.uniform1f(U.uFlash,RM?0:S.flash);
    gl.uniform1f(U.uRoll,RM?0:Math.sin(t*.8)*.022*S.shake);gl.uniform1f(U.uClear,S.clear);gl.uniform1f(U.uGlow,S.glow);
    gl.drawArrays(gl.TRIANGLES,0,3);
    // 느린 기기 자동 화질 조절
    acc+=dt;frames++;if(acc>1.5&&tune<3){const fps=frames/acc;if(fps<40&&scale>.6){scale-=.15;size();tune++}acc=0;frames=0}
  }
  placeFG(t);drawFX(t,dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
